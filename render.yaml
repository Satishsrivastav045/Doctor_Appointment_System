services:
  - type: web
    name: doctor-appointment-system
    env: python
    buildCommand: pip install -r requirements.txt && python core/manage.py collectstatic --noinput && python core/manage.py migrate && python core/manage.py seed_demo && python core/manage.py ensure_superuser
    startCommand: gunicorn core.wsgi:application --chdir core
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: doctor-appointment-db
          property: connectionString

databases:
  - name: doctor-appointment-db
    databaseName: doctor_appointment_system
    user: doctor_appointment_user
