{% extends 'base.html' %}

{% block content %}
<style>
    .form-shell {
        max-width: 760px;
        margin: 10px auto 0;
    }

    .medicine-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .field-full {
        grid-column: 1 / -1;
    }

    .medicine-form label {
        display: block;
        margin-bottom: 8px;
        color: var(--navy);
        font-weight: 800;
    }

    .medicine-form input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
        color: var(--text);
        font: inherit;
    }

    .check-field {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--navy);
        font-weight: 800;
    }

    .check-field input {
        width: auto;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    @media (max-width: 720px) {
        .medicine-form {
            grid-template-columns: 1fr;
        }
    }
</style>

<section class="card form-shell">
    <h2 style="margin: 0 0 8px; color: var(--navy);">{% if medicine %}Edit Medicine{% else %}Add Medicine{% endif %}</h2>
    <p style="margin: 0 0 22px; color: var(--muted);">{{ pharmacy.shop_name }} ke public stock me medicine details dikhengi.</p>

    <form method="POST" class="medicine-form">
        {% csrf_token %}
        <div class="field-full">
            <label for="medicine_name">Medicine Name</label>
            <input type="text" id="medicine_name" name="medicine_name" value="{{ medicine.medicine_name }}" placeholder="Paracetamol" required>
        </div>
        <div>
            <label for="brand_name">Brand Name</label>
            <input type="text" id="brand_name" name="brand_name" value="{{ medicine.brand_name }}" placeholder="Dolo, Calpol, etc.">
        </div>
        <div>
            <label for="strength">Strength</label>
            <input type="text" id="strength" name="strength" value="{{ medicine.strength }}" placeholder="500mg">
        </div>
        <div>
            <label for="form">Form</label>
            <input type="text" id="form" name="form" value="{{ medicine.form }}" placeholder="Tablet, syrup, injection">
        </div>
        <div>
            <label for="price">Price</label>
            <input type="number" step="0.01" min="0" id="price" name="price" value="{{ medicine.price|default:0 }}">
        </div>
        <div>
            <label for="quantity">Quantity</label>
            <input type="number" min="0" id="quantity" name="quantity" value="{{ medicine.quantity|default:0 }}">
        </div>
        <div class="field-full">
            <label class="check-field" for="prescription_required">
                <input type="checkbox" id="prescription_required" name="prescription_required" {% if medicine.prescription_required %}checked{% endif %}>
                Prescription required
            </label>
        </div>
        <div class="field-full form-actions">
            <button type="submit" class="btn">{% if medicine %}Update Medicine{% else %}Add Medicine{% endif %}</button>
            <a href="/pharmacy-dashboard/" class="btn btn-secondary">Back</a>
        </div>
    </form>
</section>
{% endblock %}
